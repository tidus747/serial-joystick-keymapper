name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: desktop_app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop_app/requirements.txt
          python -m pip install pytest

      - name: Compile Python sources
        run: python -m compileall desktop_app/app desktop_app/main.py

      - name: Run tests
        env:
          PYTHONPATH: desktop_app
        run: python -m pytest desktop_app/tests -q
